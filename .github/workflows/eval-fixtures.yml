name: Keyless evidence fixtures

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    env:
      FINN_MODEL_PROVIDER: keyless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_brief.py tests/test_retrieval_fidelity.py tests/test_evaluation.py tests/test_xbrl.py tests/test_alerts.py tests/test_calendar_feed.py
