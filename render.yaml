# Render blueprint (proposal only). Not applied: creating it would provision a paid
# service with a persistent disk. Verify plan/price and memory on the largest report first.
services:
  - type: web
    name: finn
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    disk:
      name: finn-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: FINN_DATA_DIR
        value: /data
      # Free by default: leave GEMINI_API_KEY blank for the keyless build (no model, no spend),
      # or paste a free Google AI Studio key for genuine synthesis at zero per-token cost.
      - key: FINN_MODEL_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false          # set a free AI Studio key in the dashboard, or leave blank
      - key: FINN_MODEL_PRIMARY_EFFORT
        value: low
      - key: FINN_API_BUDGET_USD
        value: "5"
      - key: FINN_JOB_BUDGET_USD
        value: "0.25"
