name: Verify portfolio digest access
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-data-publish
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FINN_MODEL_PROVIDER: keyless
      PYTHONPATH: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/backend/requirements.txt
      - name: Probe NSE from this runner
        run: python app/scripts/probe_nse_runner.py
