# Render blueprint — FREE tier, no credit card, no persistent disk.
# The corpus is baked into the Docker image from the GitHub Release (see Dockerfile), so no disk
# is needed. Free instances sleep after ~15 min idle and wake on the next request (~1 min); the
# always-on link is the static GitHub Pages demo. Deploy: render.com -> New -> Blueprint (or Web
# Service -> connect this repo -> Docker). Then set GEMINI_API_KEY in the dashboard.
services:
  - type: web
    name: finn
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      # Free AI synthesis: paste a free Google AI Studio key in the dashboard (never commit it).
      # Leave it unset to run keyless (the extractive source brief still works).
      - key: GEMINI_API_KEY
        sync: false
      - key: FINN_MODEL_PROVIDER
        value: gemini
      - key: FINN_MODEL_PRIMARY_EFFORT
        value: low
      - key: FINN_API_BUDGET_USD
        value: "5"
      - key: FINN_JOB_BUDGET_USD
        value: "0.25"
