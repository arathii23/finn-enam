name: Check phone alerts

# Manual runs default to dry-run. Enable delivery separately after phone testing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List notifications without sending them"
        type: boolean
        required: true
        default: true
      test_notification:
        description: "Send one labelled test to the configured topic instead of checking filings"
        type: boolean
        required: true
        default: false

concurrency:
  group: live-data-publish
  cancel-in-progress: false

jobs:
  phone-test:
    if: inputs.test_notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PYTHONPATH: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/backend/requirements.txt
      - name: Send one phone test
        run: python -m finn alerts --test

  refresh:
    if: inputs.test_notification == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      FINN_ALERTS_ENABLED: ${{ vars.FINN_ALERTS_ENABLED }}
      FINN_ALERTS_START_AT: ${{ vars.FINN_ALERTS_START_AT }}
      FINN_ALERT_CATEGORIES: ${{ vars.FINN_ALERT_CATEGORIES }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      FINN_BASE_URL: ${{ vars.FINN_BASE_URL || 'https://finn-mow9.onrender.com' }}
      FINN_MODEL_PROVIDER: keyless
      PYTHONPATH: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the existing source-check dependencies
        run: python -m pip install -r app/backend/requirements.txt
      - name: Restore public live-data state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin live-data:refs/remotes/origin/live-data
          git worktree add --quiet --detach _state origin/live-data
          rm -f _state/alerts_status.json
      - name: Probe current NSE announcement access from this runner
        id: nse_probe
        continue-on-error: true
        run: timeout 90 python app/scripts/probe_nse_runner.py
      - name: Resolve dry-run setting
        id: mode
        shell: bash
        env:
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$REQUESTED_DRY_RUN" = "true" ] || [ "$FINN_ALERTS_ENABLED" != "1" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$NTFY_TOPIC" ] || [ -z "$FINN_ALERTS_START_AT" ]; then
              echo "Set the topic secret and a pilot start time before allowing delivery." >&2
              exit 1
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check and send directly from the runner
        if: steps.nse_probe.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          FINN_DATA_DIR: ${{ runner.temp }}/finn-alerts-data
        run: |
          set -euo pipefail
          args=(--days 7 --filings-only --state _state/alerts_state.json --status-out _state/alerts_status.json)
          if [ -n "$FINN_ALERTS_START_AT" ]; then args+=(--since "$FINN_ALERTS_START_AT"); fi
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python -m finn alerts "${args[@]}"
      - name: Use FINN's existing Render refresh when runner access is unavailable
        if: steps.nse_probe.outcome != 'success' || (steps.nse_probe.outcome == 'success' && hashFiles('_state/alerts_status.json') == '')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(--base-url "$FINN_BASE_URL" --days 7 --filings-only --state _state/alerts_state.json --out-state _state/alerts_state.json --out-status _state/alerts_status.json)
          if [ -n "$FINN_ALERTS_START_AT" ]; then args+=(--since "$FINN_ALERTS_START_AT"); fi
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python app/scripts/run_scheduled_alerts.py "${args[@]}"
      - name: Publish alert state and last-check time to live-data
        if: always() && steps.mode.outputs.dry_run == 'false' && hashFiles('_state/alerts_status.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          cd _state
          git config user.name "finn-live-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- alerts_status.json
          if [ -f alerts_state.json ]; then git add -- alerts_state.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Update alert check status"
          git push -q origin HEAD:refs/heads/live-data
      - name: Report the alert check result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status_path = Path('_state/alerts_status.json')
          if not status_path.is_file():
              raise SystemExit('Neither source check produced an alert status.')
          status = json.loads(status_path.read_text())
          if not status['holdings_checked']:
              raise SystemExit('The alert check could not verify filings for any holdings.')
          if status['failed']:
              raise SystemExit(f"ntfy delivery failed for {status['failed']} alert(s).")
          PY
