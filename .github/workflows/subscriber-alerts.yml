name: Check followed-company phone alerts

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check matching alerts without sending to subscribers"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: subscriber-phone-alerts
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.FINN_PHONE_ALERTS_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FINN_BASE_URL: ${{ vars.FINN_BASE_URL || 'https://finn-mow9.onrender.com' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DRY_RUN: ${{ github.event_name != 'schedule' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - name: Check current filings for opted-in subscribers
        shell: bash
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "${{ github.event_name }}" = "schedule" ]; then args+=(--scheduled); fi
          python scripts/run_subscriber_alerts.py "${args[@]}"
